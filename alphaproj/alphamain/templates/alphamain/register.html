<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff, #f5f3ff, #fce7f3);
      color: #1e1b4b;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 36px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 20px 60px #3730a31a;
    }
    .logo {
      width: 52px; height: 52px; display: grid; place-items: center;
      margin: 0 auto 20px; border-radius: 16px;
      background: #4f46e5; color: white; font-size: 28px;
    }
    h1 { margin: 0; text-align: center; font-size: 27px; }
    .subtitle { margin: 10px 0 28px; text-align: center; color: #77758a; font-size: 14px; }
    label { display: block; margin: 16px 0 7px; color: #373451; font-size: 14px; font-weight: 600; }
    input {
      width: 100%; padding: 13px 14px; border: 1px solid #dddbea;
      border-radius: 10px; outline: none; font-size: 14px;
    }
    input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px #6366f120; }
    button {
      width: 100%; margin-top: 24px; padding: 14px; border: 0;
      border-radius: 10px; background: #4f46e5; color: white;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #4338ca; }
    .footer { margin: 22px 0 0; text-align: center; color: #77758a; font-size: 13px; }
    a { color: #4f46e5; text-decoration: none; font-weight: 600; }
    #message { margin-top: 14px; text-align: center; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">✦</div>
    <h1>Создать аккаунт</h1>
    <p class="subtitle">Зарегистрируйся, чтобы продолжить</p>

    <form id="register-form">
      <label for="name">Имя</label>
      <input id="name" name="name" type="text" placeholder="Твоё имя" autocomplete="name" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />

      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" placeholder="Минимум 8 символов" minlength="8" autocomplete="new-password" required />

      <button type="submit">Зарегистрироваться</button>
      <p id="message" role="status"></p>
    </form>

    <p class="footer">Уже есть аккаунт? <a href="#login" id="login-link">Войти</a></p>
  </main>

  <script>
    const form = document.querySelector("#register-form");
    const message = document.querySelector("#message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const name = document.querySelector("#name").value.trim();
      message.textContent = `Привет, ${name}! Форма заполнена. Для настоящей регистрации нужен сервер.`;
      message.style.color = "#15803d";
    });

    document.querySelector("#login-link").addEventListener("click", (event) => {
      event.preventDefault();
      message.textContent = "Форма входа пока не добавлена.";
      message.style.color = "#4f46e5";
    });
  </script>
</body>
</html>
